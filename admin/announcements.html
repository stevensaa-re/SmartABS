<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengumuman — SMARTABS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/table.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
</head>
<body data-role="admin" data-page="announcements">
<script src="../js/guard.js"></script>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="main">
    <header class="navbar" id="navbar"></header>

    <main class="content">
      <div class="page-head">
        <div>
          <h1>Pengumuman</h1>
          <p>Kelola informasi yang ditampilkan ke guru dan siswa.</p>
        </div>
        <button class="btn btn-primary" id="btnAddAnnouncement">
          <i class="fa-solid fa-plus"></i> Buat Pengumuman
        </button>
      </div>

      <section class="card">
        <div class="table-toolbar">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchAnnouncement" class="form-control" placeholder="Cari judul pengumuman...">
          </div>
          <div class="filter-group">
            <select id="filterAnnouncementStatus" class="form-control">
              <option value="">Semua Status</option>
              <option value="Publish">Publish</option>
              <option value="Draft">Draft</option>
            </select>
          </div>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Judul</th>
                <th>Tanggal</th>
                <th>Status</th>
                <th class="text-right">Aksi</th>
              </tr>
            </thead>
            <tbody id="announcementTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="modal" id="announcementModal">
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 id="announcementModalTitle">Buat Pengumuman</h3>
      <button class="icon-btn" id="closeAnnouncementModal" aria-label="Tutup">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <form id="announcementForm" novalidate>
      <div class="modal-body">
        <input type="hidden" id="announcementId">

        <div class="form-group">
          <label for="announcementTitle">Judul <span class="req">*</span></label>
          <input type="text" id="announcementTitle" class="form-control" placeholder="Judul pengumuman" required>
          <small class="form-error" id="errAnnouncementTitle"></small>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="announcementDate">Tanggal <span class="req">*</span></label>
            <input type="date" id="announcementDate" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="announcementStatus">Status</label>
            <select id="announcementStatus" class="form-control">
              <option value="Publish">Publish</option>
              <option value="Draft">Draft</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="announcementContent">Isi Pengumuman <span class="req">*</span></label>
          <textarea id="announcementContent" class="form-control" rows="5" placeholder="Tulis isi pengumuman..." required></textarea>
          <small class="form-error" id="errAnnouncementContent"></small>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="cancelAnnouncementModal">Batal</button>
        <button type="submit" class="btn btn-primary" id="saveAnnouncementBtn">Simpan</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/mock-data.js"></script>
<script src="../js/adapters/local.js"></script>
<script src="../js/adapters/mysql.js"></script>
<script src="../js/adapters/firebase.js"></script>
<script src="../js/api.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/app.js"></script>
<script src="../js/announcements.js"></script>
</body>
</html>

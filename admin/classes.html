<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Kelas — SMARTABS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/table.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
</head>
<body data-role="admin" data-page="classes">
<script src="../js/guard.js"></script>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="main">
    <header class="navbar" id="navbar"></header>

    <main class="content">
      <div class="page-head">
        <div>
          <h1>Data Kelas</h1>
          <p>Daftar rombongan belajar dan jumlah siswanya.</p>
        </div>
        <button class="btn btn-primary" id="btnAddClass">
          <i class="fa-solid fa-plus"></i> Tambah Kelas
        </button>
      </div>

      <section class="card">
        <div class="table-toolbar">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchClass" class="form-control" placeholder="Cari nama kelas...">
          </div>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nama Kelas</th>
                <th>Tingkat</th>
                <th>Jurusan</th>
                <th>Blok</th>
                <th>Wali Kelas</th>
                <th>Jumlah Siswa</th>
                <th class="text-right">Aksi</th>
              </tr>
            </thead>
            <tbody id="classTableBody"></tbody>
          </table>
        </div>
        <div class="table-footer">
          <span id="classCount" class="text-muted">0 kelas</span>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="modal" id="classModal">
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 id="classModalTitle">Tambah Kelas</h3>
      <button class="icon-btn" id="closeClassModal" aria-label="Tutup">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <form id="classForm" novalidate>
      <div class="modal-body">
        <input type="hidden" id="classId">

        <div class="form-group">
          <label for="className">Nama Kelas <span class="req">*</span></label>
          <input type="text" id="className" class="form-control" placeholder="Contoh: XII RPL 2" required>
          <small class="form-error" id="errClassName"></small>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="classEducationLevel">Jenjang</label>
            <select id="classEducationLevel" class="form-control"></select>
          </div>
          <div class="form-group">
            <label for="classLevel">Tingkat</label>
            <select id="classLevel" class="form-control"></select>
          </div>
          <div class="form-group">
            <label for="classMajor">Jurusan</label>
            <select id="classMajor" class="form-control"></select>
          </div>
          <div class="form-group">
            <label for="classBlock">Blok sekolah</label>
            <select id="classBlock" class="form-control">
              <option value="">Belum ditentukan</option>
              <option value="Blok A">Blok A</option>
              <option value="Blok B">Blok B</option>
            </select>
            <small class="text-muted">Pilih lokasi gedung untuk kelas ini.</small>
          </div>
        </div>

        <div class="form-group">
          <label for="classHomeroom">Wali Kelas</label>
          <input type="text" id="classHomeroom" class="form-control" placeholder="Nama wali kelas">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="cancelClassModal">Batal</button>
        <button type="submit" class="btn btn-primary" id="saveClassBtn">Simpan</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/mock-data.js"></script>
<script src="../js/adapters/local.js"></script>
<script src="../js/adapters/mysql.js"></script>
<script src="../js/adapters/firebase.js"></script>
<script src="../js/api.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/app.js"></script>
<script src="../js/classes.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Pelajaran — SMARTABS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/table.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
</head>
<body data-role="admin" data-page="schedule">
<script src="../js/guard.js"></script>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="main">
    <header class="navbar" id="navbar"></header>

    <main class="content">
      <div class="page-head">
        <div>
          <h1>Jadwal Pelajaran</h1>
          <p>Atur jadwal mata pelajaran per kelas.</p>
        </div>
        <button class="btn btn-primary" id="btnAddSchedule">
          <i class="fa-solid fa-plus"></i> Tambah Jadwal
        </button>
      </div>

      <section class="card">
        <div class="table-toolbar">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchSchedule" class="form-control" placeholder="Cari mata pelajaran atau guru...">
          </div>
          <div class="filter-group">
            <select id="filterScheduleDay" class="form-control">
              <option value="">Semua Hari</option>
            </select>
            <select id="filterScheduleClass" class="form-control">
              <option value="">Semua Kelas</option>
            </select>
          </div>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Jam</th>
                <th>Mata Pelajaran</th>
                <th>Guru</th>
                <th>Kelas</th>
                <th class="text-right" colspan="2">Aksi</th>
              </tr>
            </thead>
            <tbody id="scheduleTableBody"></tbody>
          </table>
        </div>
        <div class="table-footer">
          <span id="scheduleCount" class="text-muted">0 jadwal</span>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="modal" id="scheduleModal">
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 id="scheduleModalTitle">Tambah Jadwal</h3>
      <button class="icon-btn" id="closeScheduleModal" aria-label="Tutup">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <form id="scheduleForm" novalidate>
      <div class="modal-body">
        <input type="hidden" id="scheduleId">

        <div class="form-row">
          <div class="form-group">
            <label for="scheduleDay">Hari <span class="req">*</span></label>
            <select id="scheduleDay" class="form-control" required></select>
          </div>
          <div class="form-group">
            <label for="scheduleClass">Kelas <span class="req">*</span></label>
            <select id="scheduleClass" class="form-control" required></select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="scheduleStart">Jam Mulai <span class="req">*</span></label>
            <input type="time" id="scheduleStart" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="scheduleEnd">Jam Selesai <span class="req">*</span></label>
            <input type="time" id="scheduleEnd" class="form-control" required>
          </div>
        </div>

        <div class="form-group">
          <label for="scheduleSubject">Mata Pelajaran <span class="req">*</span></label>
          <input type="text" id="scheduleSubject" class="form-control" placeholder="Contoh: Pemrograman Web" required>
          <small class="form-error" id="errScheduleSubject"></small>
        </div>

        <div class="form-group">
          <label for="scheduleTeacher">Guru Pengampu <span class="req">*</span></label>
          <input type="text" id="scheduleTeacher" class="form-control" placeholder="Nama guru" required>
          <small class="form-error" id="errScheduleTeacher"></small>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="cancelScheduleModal">Batal</button>
        <button type="submit" class="btn btn-primary" id="saveScheduleBtn">Simpan</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/mock-data.js"></script>
<script src="../js/adapters/local.js"></script>
<script src="../js/adapters/mysql.js"></script>
<script src="../js/adapters/firebase.js"></script>
<script src="../js/api.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/app.js"></script>
<script src="../js/schedule.js"></script>
</body>
</html>

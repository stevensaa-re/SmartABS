name: Build SMARTABS Windows desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refuse to package server credentials
        shell: pwsh
        run: |
          if (Test-Path "database/firebase/serviceAccountKey.json") {
            throw "Remove the Firebase Admin service-account key before packaging."
          }
          if (Get-ChildItem -Path . -Filter ".env" -Recurse -File -ErrorAction SilentlyContinue) {
            throw "Remove .env files before packaging."
          }

      - name: Install desktop dependencies
        run: npm ci

      - name: Build x64 installer and portable executable
        run: npm run desktop:win

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: smartabs-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach packages to desktop release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" dist/*.exe --title "$env:GITHUB_REF_NAME" --notes "SMARTABS Desktop untuk Windows x64."

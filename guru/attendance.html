<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Kelas — SMARTABS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/table.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
</head>
<body data-role="guru" data-page="attendance">
<script src="../js/guard.js"></script>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="main">
    <header class="navbar" id="navbar"></header>

    <main class="content">
      <div class="page-head">
        <div>
          <h1>Absensi Kelas</h1>
          <p>Pantau dan perbarui status kehadiran siswa.</p>
        </div>
      </div>

      <section class="card">
        <div class="table-toolbar">
          <div class="filter-group">
            <select id="attendanceClass" class="form-control"></select>
            <input type="date" id="attendanceDate" class="form-control">
          </div>
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchAttendance" class="form-control" placeholder="Cari nama siswa...">
          </div>
        </div>

        <div class="summary-strip" id="attendanceSummary"></div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th class="text-center">No</th>
                <th>NIS</th>
                <th>Nama</th>
                <th>Kelas</th>
                <th>Status</th>
                <th>Waktu</th>
                <th class="text-right">Aksi</th>
              </tr>
            </thead>
            <tbody id="attendanceTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- Modal ubah status -->
<div class="modal" id="statusModal">
  <div class="modal-dialog modal-sm">
    <div class="modal-header">
      <h3>Ubah Status Kehadiran</h3>
      <button class="icon-btn" id="closeStatusModal" aria-label="Tutup">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <form id="statusForm">
      <div class="modal-body">
        <input type="hidden" id="statusNis">
        <p class="modal-info" id="statusStudentInfo">-</p>

        <div class="form-group">
          <label for="statusValue">Status</label>
          <select id="statusValue" class="form-control">
            <option value="Hadir">Hadir</option>
            <option value="Izin">Izin</option>
            <option value="Sakit">Sakit</option>
            <option value="Alpa">Alpa</option>
          </select>
        </div>

        <div class="form-group">
          <label for="statusNote">Keterangan</label>
          <input type="text" id="statusNote" class="form-control" placeholder="Opsional">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="cancelStatusModal">Batal</button>
        <button type="submit" class="btn btn-primary">Simpan Status</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/mock-data.js"></script>
<script src="../js/adapters/local.js"></script>
<script src="../js/adapters/mysql.js"></script>
<script src="../js/adapters/firebase.js"></script>
<script src="../js/api.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/app.js"></script>
<script src="../js/attendance.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Absensi — SMARTABS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/table.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
</head>
<body data-role="guru" data-page="reports">
<script src="../js/guard.js"></script>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="main">
    <header class="navbar" id="navbar"></header>

    <main class="content">
      <div class="page-head no-print">
        <div>
          <h1>Laporan Absensi</h1>
          <p>Rekap kehadiran siswa per kelas dan periode.</p>
        </div>
        <div class="head-actions">
          <button class="btn btn-outline" id="btnExportCsv">
            <i class="fa-solid fa-file-csv"></i> Export CSV
          </button>
          <button class="btn btn-primary" id="btnPrint">
            <i class="fa-solid fa-print"></i> Print
          </button>
        </div>
      </div>

      <section class="card no-print">
        <div class="card-body">
          <div class="filter-bar">
            <div class="form-group">
              <label for="reportFrom">Dari Tanggal</label>
              <input type="date" id="reportFrom" class="form-control">
            </div>
            <div class="form-group">
              <label for="reportTo">Sampai Tanggal</label>
              <input type="date" id="reportTo" class="form-control">
            </div>
            <div class="form-group">
              <label for="reportClass">Kelas</label>
              <select id="reportClass" class="form-control">
                <option value="">Semua Kelas</option>
              </select>
            </div>
            <div class="form-group">
              <label for="reportStatus">Status</label>
              <select id="reportStatus" class="form-control">
                <option value="">Semua Status</option>
                <option value="Hadir">Hadir</option>
                <option value="Izin">Izin</option>
                <option value="Sakit">Sakit</option>
                <option value="Alpa">Alpa</option>
              </select>
            </div>
            <div class="form-group">
              <label>&nbsp;</label>
              <button class="btn btn-primary btn-block" id="btnFilterReport">
                <i class="fa-solid fa-filter"></i> Filter
              </button>
            </div>
          </div>
        </div>
      </section>

      <section class="card" id="reportCard">
        <div class="card-header">
          <h3>Rekap Kehadiran</h3>
          <span class="text-muted" id="reportPeriod">-</span>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Nama</th>
                <th>NIS</th>
                <th>Kelas</th>
                <th class="text-center">Hadir</th>
                <th class="text-center">Izin</th>
                <th class="text-center">Sakit</th>
                <th class="text-center">Alpa</th>
                <th>Persentase</th>
              </tr>
            </thead>
            <tbody id="reportTableBody"></tbody>
            <tfoot id="reportTableFoot"></tfoot>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="../js/mock-data.js"></script>
<script src="../js/adapters/local.js"></script>
<script src="../js/adapters/mysql.js"></script>
<script src="../js/adapters/firebase.js"></script>
<script src="../js/api.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/app.js"></script>
<script src="../js/reports.js"></script>
</body>
</html>

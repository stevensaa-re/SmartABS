<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Mengajar — SMARTABS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/table.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
</head>
<body data-role="guru" data-page="schedule">
<script src="../js/guard.js"></script>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="main">
    <header class="navbar" id="navbar"></header>

    <main class="content">
      <div class="page-head">
        <div>
          <h1>Jadwal Mengajar</h1>
          <p id="scheduleSubtitle">Jadwal mengajar Anda.</p>
        </div>
        <a class="btn btn-primary" href="attendance.html">
          <i class="fa-solid fa-clipboard-check"></i> Buka Absensi
        </a>
      </div>

      <section class="card">
        <div class="table-toolbar">
          <div>
            <h2>Agenda Mingguan</h2>
            <p class="text-muted">Pilih hari untuk melihat mata pelajaran yang perlu Anda ajar.</p>
          </div>
          <div class="chip-filter" id="dayFilter" aria-label="Filter jadwal berdasarkan hari"></div>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Jam</th>
                <th>Mata Pelajaran</th>
                <th>Kelas</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="scheduleTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="../js/mock-data.js"></script>
<script src="../js/adapters/local.js"></script>
<script src="../js/adapters/mysql.js"></script>
<script src="../js/adapters/firebase.js"></script>
<script src="../js/api.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/app.js"></script>
<script src="../js/schedule.js"></script>
</body>
</html>

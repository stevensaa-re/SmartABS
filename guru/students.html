<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Siswa — SMARTABS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/table.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
</head>
<body data-role="guru" data-page="students">
<script src="../js/guard.js"></script>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="main">
    <header class="navbar" id="navbar"></header>

    <main class="content">
      <div class="page-head">
        <div>
          <h1>Data Siswa</h1>
          <p>Daftar siswa beserta status kehadiran hari ini (hanya lihat).</p>
        </div>
      </div>

      <section class="card">
        <div class="table-toolbar">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchStudent" class="form-control" placeholder="Cari NIS atau nama siswa...">
          </div>
          <div class="filter-group">
            <select id="filterClass" class="form-control">
              <option value="">Semua Kelas</option>
            </select>
          </div>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>NIS</th>
                <th>Nama</th>
                <th>Kelas</th>
                <th>L/P</th>
                <th>Status Hari Ini</th>
              </tr>
            </thead>
            <tbody id="studentTableBody"></tbody>
          </table>
        </div>
        <div class="table-footer">
          <span id="studentCount" class="text-muted">0 siswa</span>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="../js/mock-data.js"></script>
<script src="../js/adapters/local.js"></script>
<script src="../js/adapters/mysql.js"></script>
<script src="../js/adapters/firebase.js"></script>
<script src="../js/api.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/app.js"></script>
<script src="../js/students.js"></script>
</body>
</html>

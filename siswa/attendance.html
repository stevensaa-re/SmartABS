<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Hari Ini — SMARTABS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
</head>
<body data-role="siswa" data-page="attendance">
<script src="../js/guard.js"></script>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="main">
    <header class="navbar" id="navbar"></header>

    <main class="content">
      <div id="attendanceNetworkStatus" class="network-status" role="status"></div>
      <div class="page-head">
        <div>
          <h1>Absensi Hari Ini</h1>
          <p>Pindai QR yang ditampilkan guru di kelas untuk mencatat kehadiran pada mata pelajaran yang sedang berlangsung.</p>
        </div>
      </div>

      <section class="attendance-panel" id="attendancePanel">
        <div class="attendance-icon" id="attendanceIcon">
          <i class="fa-solid fa-qrcode"></i>
        </div>

        <h2 id="attendanceTitle">Absensi per Mata Pelajaran</h2>
        <p class="text-muted" id="attendanceSubtitle">QR hanya berlaku singkat dan hanya dapat digunakan sekali oleh akun Anda.</p>

        <div class="attendance-info" id="attendanceInfo"></div>

        <div class="attendance-status hidden" id="attendanceStatusBox"></div>
        <div id="todaySubjectAttendance" class="subject-attendance-list"></div>
        <div id="qrScanner" class="qr-scanner hidden"></div>
        <p id="qrScanMessage" class="text-muted" role="status"></p>

        <button class="btn btn-primary btn-lg" id="btnAbsen">
          <i class="fa-solid fa-camera"></i> PINDAI QR MATA PELAJARAN
        </button>
      </section>
    </main>
  </div>
</div>

<script src="../js/mock-data.js"></script>
<script src="../js/adapters/local.js"></script>
<script src="../js/adapters/mysql.js"></script>
<script src="../js/adapters/firebase.js"></script>
<script src="../js/api.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/app.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="../js/attendance.js"></script>
</body>
</html>
